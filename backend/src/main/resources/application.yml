spring:
  application:
    name: nexabank-api
  datasource:
    # Zero-setup default: in-memory H2. Activate the "mysql" profile for a persistent database.
    url: jdbc:h2:mem:nexabank;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

nexabank:
  seed:
    enabled: true
  security:
    jwt-secret: ${NEXABANK_JWT_SECRET:dev-only-secret-please-override-in-production-0123456789}
    token-ttl-minutes: 60
    admin-password: ${NEXABANK_ADMIN_PASSWORD:admin123}
    teller-password: ${NEXABANK_TELLER_PASSWORD:teller123}
    allowed-origins:
      - http://localhost:4200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexabank}?createDatabaseIfNotExist=true
    username: ${DB_USER:nexabank}
    password: ${DB_PASSWORD:nexabank}
  jpa:
    hibernate:
      ddl-auto: update

nexabank:
  seed:
    enabled: false

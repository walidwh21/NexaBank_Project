# Optional persistent database for the "mysql" Spring profile.
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexabank
      MYSQL_USER: nexabank
      MYSQL_PASSWORD: nexabank
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - nexabank-data:/var/lib/mysql
volumes:
  nexabank-data:
